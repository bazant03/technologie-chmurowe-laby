services:
  
  php:
    image: php:8.5.7RC2-fpm-alpine3.22
    container_name: php
    restart: unless-stopped
    volumes:
      - ./html:/var/www/html
    networks:
      - internal

  nginx:
    image: nginx:1.31.1-alpine
    container_name: nginx
    restart: unless-stopped
    volumes:
      - ./html:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - internal
    depends_on:
      - php

networks:
  internal:
    driver: bridge