services:
  
  mysql:
    image: mysql:9.7.0
    container_name: mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=to_nie_produkcja
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - back

  php-app:
    build: .
    container_name: php-app
    restart: unless-stopped
    volumes:
      - ./html:/var/www/html
    networks:
      - back
    depends_on:
      - mysql

  phpmyadmin:
    image: phpmyadmin:fpm-alpine
    container_name: phpmyadmin
    restart: unless-stopped
    environment:
      - PMA_HOST=mysql
      - PMA_ABSOLUTE_URI=http://localhost:4001/pma/
    volumes:
      - pma-html:/var/www/html
    networks:
      - back
    depends_on:
      - mysql

  nginx:
    image: nginx:1.31.1-alpine
    container_name: nginx
    restart: unless-stopped
    volumes:
      - pma-html:/var/www/pma-html:ro
      - ./html:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - front
      - back
    ports:
      - 4001:4001
    depends_on:
      - php-app
      - phpmyadmin

volumes:
  mysql-data:
  pma-html:

networks:
  
  front:
    driver: bridge
  
  back:
    driver: bridge