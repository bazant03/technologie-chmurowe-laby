server {
    listen 4001;
    server_name localhost;

    root /var/www/html;
    index index.php;

    location / {
        # Próbuje otworzyć plik, potem folder, a na końcu zwraca błąd 404
        try_files $uri $uri/ =404;
    }

    # Ta sekcja odpowiada za przekierowanie ruchu
    location ~ \.php$ {
        fastcgi_pass php-app:9000; # php-app z docker compose
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}